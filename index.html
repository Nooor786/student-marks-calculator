<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Student Marks Calculator</h2>

    <input type="number" id="m1" placeholder="Subject 1 Marks">
    <input type="number" id="m2" placeholder="Subject 2 Marks">
    <input type="number" id="m3" placeholder="Subject 3 Marks">
    <input type="number" id="m4" placeholder="Subject 4 Marks">
    <input type="number" id="m5" placeholder="Subject 5 Marks">

    <button onclick="calculate()">Calculate</button>
    <button class="dark-btn" onclick="toggleTheme()">Toggle Dark Mode</button>

    <p>Total: <span id="total">0</span></p>
    <p>Average: <span id="average">0</span></p>
    <p>Grade: <span id="grade">-</span></p>
    <p>Status: <span id="status">-</span></p>
</div>

<script src="script.js"></script>
</body>
</html>
